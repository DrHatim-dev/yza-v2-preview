<main>
  <div class="container-wide" id="productRoot">
    <div class="product product--cg">
      <section class="product-info" aria-label="Product details">
        <nav class="product-info__breadcrumb" aria-label="Breadcrumb">
          <a href="/yza-v2-preview/" data-i18n="breadcrumb.home">Accueil</a><span>/</span>
          <a id="pBreadcrumbCat" href="/yza-v2-preview/collections/charms" data-i18n="nav.charms">Boutique</a><span>/</span>
          <span id="pBreadcrumbName">YZA</span>
        </nav>
        <h1 id="pName">YZA</h1>
        <div class="product-info__price" id="pPrice">0 dh</div>
        <p class="product-info__short" id="pShort"></p>
        <ul class="product-info__bullets" id="pBullets"></ul>
        <div class="product-info__divider" aria-hidden="true"></div>

        <div class="option product-color" id="pColorWrap" hidden>
          <div class="product-color__name" id="pColorName"></div>
          <div class="product-color__row">
            <div class="product-color__swatches" id="pColorSwatches"></div>
            <button type="button" class="product-color__viewall" id="pViewColors" hidden>Voir les couleurs</button>
          </div>
        </div>

        <div class="option" id="pFinish" hidden>
          <div class="option__label" data-i18n="pp.finish">Finition</div>
          <div class="chips" id="pFinishOpts"></div>
        </div>

        <!-- Selecteur de TAILLE. Jusqu'au 2026-08-03 les tailles n'etaient qu'une ligne de
             texte dans l'accordeon : la chemise se vendait en S/M/L sans que la cliente
             puisse en choisir une, et la commande partait donc sans taille. -->
        <div class="option" id="pSize" hidden>
          <div class="option__label" data-i18n="pp.size">Taille</div>
          <div class="chips" id="pSizeOpts"></div>
        </div>

        <div class="option option--add">
          <div class="pp-scarcity" id="pScarcity" hidden></div>
          <input id="pQty" type="hidden" min="1" value="1" aria-label="Quantite">
          <!-- data-track pose le 2026-08-24. add_to_cart figure dans la liste des
               contacts cote serveur (yza-collect.php) mais n'y est JAMAIS arrive : le
               seul emetteur, cart.js:156, passe par YZA.analytics.track(), qui n'ecrit
               que les compteurs localStorage et Plausible et n'appelle pas
               yza-collect.php. Verifie le 2026-08-24 : 178 clics « Ajouter au panier »
               le 23/08, zero add_to_cart dans le journal. Le clic delegue, lui, y va. -->
          <button class="btn product-add-main" id="pAdd" type="button" data-track="add_to_cart">
            <span class="product-add-main__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12.5H7L6 8Z"/><path d="M9 8.5V6.5a3 3 0 0 1 6 0v2"/></svg></span>
            <span class="product-add-main__label" data-i18n="pp.add">Ajouter au panier</span>
            <span class="product-add-main__price" id="pAddPrice"></span>
          </button>
          <div class="pp-shipbar" id="pShipBar" aria-live="polite"></div>
          <div class="product-info__links">
            <button type="button" class="link-underline" id="sameDayDelivery">Livraison le jour même</button>
          </div>
        </div>

        <div class="product-trust-chips" id="pTrustChips" aria-label="Services YZA"></div>
        <div class="bundle-panel" id="pBundle" hidden></div>

        <section class="product-story" id="productStory" aria-label="L'histoire du produit" hidden></section>

        <div class="accordion product-accordions" id="accordion">
          <div class="accordion__item">
            <button class="accordion__btn" aria-expanded="false"><span id="accSizeFitLabel">TAILLE & COUPE</span><span class="plus" aria-hidden="true"><svg class="acc-glyph" viewBox="0 0 24 24"><path class="acc-dia" d="M12 2.5 21.5 12 12 21.5 2.5 12Z"/><path class="acc-bar-h" d="M7.2 12h9.6"/><path class="acc-bar-v" d="M12 7.2v9.6"/></svg></span></button>
            <div class="accordion__panel"><div class="accordion__panel-inner" id="accDetails"></div></div>
          </div>
          <div class="accordion__item">
            <button class="accordion__btn" aria-expanded="false"><span id="accMakingLabel">LA FABRICATION</span><span class="plus" aria-hidden="true"><svg class="acc-glyph" viewBox="0 0 24 24"><path class="acc-dia" d="M12 2.5 21.5 12 12 21.5 2.5 12Z"/><path class="acc-bar-h" d="M7.2 12h9.6"/><path class="acc-bar-v" d="M12 7.2v9.6"/></svg></span></button>
            <div class="accordion__panel"><div class="accordion__panel-inner" id="accMaking"></div></div>
          </div>
          <div class="accordion__item">
            <button class="accordion__btn" aria-expanded="false"><span id="accCareLabel">COMPOSITION & ENTRETIEN</span><span class="plus" aria-hidden="true"><svg class="acc-glyph" viewBox="0 0 24 24"><path class="acc-dia" d="M12 2.5 21.5 12 12 21.5 2.5 12Z"/><path class="acc-bar-h" d="M7.2 12h9.6"/><path class="acc-bar-v" d="M12 7.2v9.6"/></svg></span></button>
            <div class="accordion__panel"><div class="accordion__panel-inner" id="accCare"></div></div>
          </div>
          <div class="accordion__item">
            <button class="accordion__btn" aria-expanded="false"><span id="accDeliveryLabel">LIVRAISON, ÉCHANGES & RETOURS</span><span class="plus" aria-hidden="true"><svg class="acc-glyph" viewBox="0 0 24 24"><path class="acc-dia" d="M12 2.5 21.5 12 12 21.5 2.5 12Z"/><path class="acc-bar-h" d="M7.2 12h9.6"/><path class="acc-bar-v" d="M12 7.2v9.6"/></svg></span></button>
            <div class="accordion__panel"><div class="accordion__panel-inner" id="accShip"></div></div>
          </div>
        </div>
      </section>

      <section class="gallery" aria-label="Product media">
        <div class="gallery__main" id="galMain"></div>
        <div class="gallery__thumbs" id="galThumbs"></div>
        <div class="gallery__wish" id="pGalleryWish"></div>
      </section>
    </div>

    <section class="product-rail-section section" style="padding-top:0">
      <div class="product-rail-block">
        <div class="product-tabs" role="tablist" aria-label="Product recommendations">
          <button type="button" class="product-tabs__tab is-active" id="productRailSimilarLabel" data-product-tab="similar">PRODUITS SIMILAIRES</button>
          <button type="button" class="product-tabs__tab" id="productRailAlsoLabel" data-product-tab="also">VOUS AIMEREZ AUSSI</button>
        </div>
        <div class="yza-swiper swiper" id="similarRail"></div>
      </div>
    </section>
  </div>
</main>
