 <!-- Mood (jour / nuit) — appliqué AVANT le premier paint. Sans ça, une visiteuse en
      mode nuit verrait un flash blanc le temps que main.js se charge. Volontairement
      inline et sans dépendance : c'est le seul moyen d'être certain de passer avant le rendu. -->
 <script>(function(){try{if(!/^\/collections\/(?:pret-a-porter|rtw)\/?$/.test(location.pathname))return;var h=new Date().getHours();document.documentElement.setAttribute('data-yza-mood',h>=6&&h<18?'day':'night');}catch(e){}})();</script>

 <header class="collection-head">
 <h1 id="collectionTitle"><span id="collectionTitleText" data-i18n="col.all">Toute la boutique</span><sup id="collectionCount" class="collection-head__count" aria-hidden="true"></sup></h1>
 <p><em id="searchEcho"></em></p>
 </header>

 <div class="toolbar">
 <div class="filter-chips" role="group" aria-label="Catégories">
 <button data-cat="all" data-i18n="col.all">Toute la boutique</button>
 <button data-cat="charms" data-i18n="col.charms">Charms en raphia</button>
 <button data-cat="accessories" data-i18n="col.accessories">Bijoux</button>

 </div>
 <div class="toolbar__right">
 <!-- La bascule Jour / Nuit n'est plus ici : elle est devenue un bouton flottant en bas
      à gauche de la page (voir #moodSwitch juste après </main>). Elle laisse donc toute
      la largeur au spectre des coloris, qui en manquait sous 860px. -->
 <!-- Spectre des coloris — revele par main.js uniquement sur le pret-a-porter, ou les
      8 pieces partagent exactement les 9 memes coloris Jawhara. Un seul geste (clic,
      glisse ou fleches) rhabille TOUTE la grille dans le meme coloris. Les pastilles
      sont generees depuis YZA.jawharaColors : aucun hex n'est duplique ici. -->
 <div class="spectrum" id="rtwSpectrum" hidden>
 <span class="spectrum__label" data-i18n="spectrum.label">Coloris</span>
 <div class="spectrum__rail" id="rtwSpectrumRail" role="radiogroup"></div>
 <span class="spectrum__name" id="rtwSpectrumName" aria-live="polite"></span>
 </div>
 <div class="grid-density" role="group" aria-label="View by" id="gridDensity">
 <span class="grid-density__label" data-i18n="col.viewby">Voir par</span>
 <button type="button" class="grid-density__btn is-active" data-density="3" aria-pressed="true" aria-label="3">3</button>
 <button type="button" class="grid-density__btn" data-density="4" aria-pressed="false" aria-label="4">4</button>
 <button type="button" class="grid-density__btn" data-density="6" aria-pressed="false" aria-label="6">6</button>
 </div>
 <div class="bag-filter-group" id="bagFilterGroup" hidden aria-label="Filtrer les sacs">
 <label class="bag-filter" for="bagFamilyFilter"><span>Collection</span><select id="bagFamilyFilter"><option value="">Toutes</option></select></label>
 <label class="bag-filter" for="bagSizeFilter"><span>Taille</span><select id="bagSizeFilter"><option value="">Toutes</option><option value="XS">XS</option><option value="S">S</option><option value="M">M</option></select></label>
 <label class="bag-filter collection-color-filter" for="colorFilter"><span>Couleur</span><select id="colorFilter"><option value="">Toutes</option></select></label>
 </div>
 <span class="results-count sr-only" id="resultCount"></span>
 <div class="collection-sort" id="collectionSort">
 <label class="sr-only" for="sortSelect" data-i18n="col.sort">Trier</label>
 <select id="sortSelect" aria-label="Trier">
 <option value="feat" data-i18n="col.sort.feat">En vedette</option>
 <option value="az" data-i18n="col.sort.az">A – Z</option>
 <option value="za" data-i18n="col.sort.za">Z – A</option>
 <option value="asc" data-i18n="col.sort.asc">Prix croissant</option>
 <option value="desc" data-i18n="col.sort.desc">Prix décroissant</option>
 </select>
 </div>
 </div>
 </div>

 <div class="product-grid" id="collectionGrid"></div>

 <section class="col-story" id="colStory" hidden aria-label="L'histoire de la collection"></section>

<!-- Bascule Jour / Nuit — bouton flottant en bas à gauche (cliente 2026-08-05).
     Révélé par main.js UNIQUEMENT sur le prêt-à-porter, masqué partout ailleurs.
     Il est volontairement hors de <main> : le coin reste au même endroit quand la
     grille se re-rend, et le ciel de nuit passe dessous (main est en z-index 1).
     Icône lune = « passer en nuit », soleil = « revenir au jour » : le bouton montre
     toujours la DESTINATION, jamais l'état courant.
     Taille et ligne de base sont calées sur .lead-chat-fab, à droite : la cliente veut
     les deux coins identiques. -->
<button type="button" class="mood-fab" id="moodSwitch" role="switch" aria-checked="false" hidden>
 <span class="mood-fab__icons" aria-hidden="true">
 <svg class="mood-fab__icon mood-fab__icon--moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
 <svg class="mood-fab__icon mood-fab__icon--sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
 </span>
 <span class="mood-fab__label" data-mood-label aria-hidden="true">Mode nuit</span>
</button>
